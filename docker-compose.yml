services:
  api:
    build: .
    command: uvicorn app.fastapi_app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATAMORPHX_MAX_UPLOAD_MB=50
      # Comma-separated keys; the API rejects all requests if this is empty.
      - DATAMORPHX_API_KEYS=${DATAMORPHX_API_KEYS:-}
    volumes:
      - ./datamorphx:/app/datamorphx
      - ./app:/app/app
  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.headless true --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./datamorphx:/app/datamorphx
      - ./app:/app/app
